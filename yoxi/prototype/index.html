<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>On Track 概念原型｜yoxi</title>
<meta name="description" content="yoxi App 新功能 On Track 的互動概念原型（示意資料）">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{
  /* 品牌（取自 yoxi 官網 CSS；紅色與藍灰各調深一階以符合文字對比 4.5:1） */
  --red:#DC2F1E; --red-press:#C42819; --red-soft:#FDECEA;
  --navy-900:#051122; --navy-800:#0B1F38; --navy-600:#22344D; --slate-600:#3C4C60; --slate-400:#5E7089;
  --line:#DFE4ED; --line-strong:#C3CBDC; --bg:#F2F6F9; --surface:#FFFFFF; --blue:#0C4C80;
  /* 狀態 */
  --go:#0E9F4B; --go-soft:#E6F6EC; --warn:#E59A00; --warn-soft:#FFF4DB; --stop:#D83A2E; --stop-soft:#FCE9E7;
  /* 字 */
  --font-ui:"Noto Sans TC",system-ui,-apple-system,sans-serif;
  --font-num:"Montserrat","Noto Sans TC",system-ui,sans-serif;
  --fs-xs:12px; --fs-sm:13px; --fs-md:15px; --fs-lg:17px; --fs-xl:22px; --fs-2xl:28px;
  /* 形 */
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-pill:999px;
  --shadow-card:0 1px 2px rgba(5,17,34,.06),0 6px 18px -8px rgba(5,17,34,.16);
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font-ui);color:var(--navy-800);background:#E9EEF4;-webkit-font-smoothing:antialiased}
::selection{background:var(--red);color:#fff}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:8px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- 版面 ---------- */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding:32px 40px}
.device,.panel{zoom:var(--z,1)}
.device{position:relative;width:393px;height:852px;border-radius:58px;background:#0A0F17;padding:12px;box-shadow:0 30px 60px -20px rgba(5,17,34,.45),0 0 0 2px #2A3240 inset;flex:none}
.screen{position:relative;width:100%;height:100%;border-radius:46px;overflow:hidden;background:var(--bg);isolation:isolate}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;border-radius:20px;background:#000;z-index:60}
.statusbar{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 34px 0 40px;font-family:var(--font-num);font-weight:600;font-size:16px;z-index:50;pointer-events:none}
.statusbar svg{height:12px}
.view{position:absolute;top:0;left:0;right:0;bottom:26px;display:flex;flex-direction:column}
.screen.dark{background:#051122}
.view.enter{animation:viewIn 260ms var(--ease-out) both}
.view.leave{animation:viewOut 180ms var(--ease-out) both;pointer-events:none}
@keyframes viewIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes viewOut{to{opacity:0;transform:translateX(-12px)}}
@keyframes fadeOnly{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
.view.instant{animation:none}

.mark{position:absolute;left:50%;bottom:5px;transform:translateX(-50%);z-index:55;font-size:10px;font-weight:700;letter-spacing:.02em;padding:2px 8px;border-radius:999px;background:rgba(5,17,34,.74);color:#fff;pointer-events:none;white-space:nowrap}
.mark.on-dark{background:rgba(255,255,255,.18)}
/* ---------- 共用元件 ---------- */
.appbar{padding:62px 20px 12px;display:flex;align-items:center;gap:12px}
.appbar h1{font-size:var(--fs-lg);font-weight:700;margin:0;flex:1}
.iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--navy-800);transition:background-color 160ms ease}
@media (hover:hover) and (pointer:fine){.iconbtn:hover{background:rgba(5,17,34,.06)}}
.scroll{flex:1;overflow-y:auto;padding:0 16px 24px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-card);padding:16px}
.label{font-size:var(--fs-xs);color:var(--slate-400);font-weight:500}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:var(--r-pill);font-weight:700;font-size:var(--fs-md);transition:transform 140ms var(--ease-out),background-color 160ms ease,opacity 160ms ease;width:100%}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--red);color:#fff}
@media (hover:hover) and (pointer:fine){.btn-primary:hover{background:var(--red-press)}}
.btn-ghost{background:#fff;color:var(--navy-800);box-shadow:0 0 0 1.5px var(--line-strong) inset}
.btn[disabled]{opacity:.55;cursor:default}
.btn[disabled]:active{transform:none}
.footer{padding:12px 16px 14px;background:linear-gradient(to top,var(--bg) 70%,rgba(242,246,249,0))}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:var(--r-pill);font-size:var(--fs-xs);font-weight:700}
.chip-go{background:var(--go-soft);color:#0A7A39}
.chip-warn{background:var(--warn-soft);color:#8A5A00}
.chip-stop{background:var(--stop-soft);color:#A82A20}
.chip-muted{background:#EAEDF3;color:var(--slate-600)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.legs{display:flex;align-items:center;gap:6px;color:var(--slate-600);font-size:var(--fs-sm);font-weight:500}
.leg{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 8px;border-radius:8px;background:#EEF2F7}
.leg svg{width:16px;height:16px}
.leg-taxi{background:var(--red-soft);color:#B3271B}
.sep{color:var(--line-strong)}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:var(--fs-sm);color:var(--slate-600)}
.meta b{color:var(--navy-800);font-weight:700}
.over{color:#B3271B;font-weight:700}

/* 時間軸：預估點＋最壞情況區間＋期限線 */
.tl{position:relative;height:46px;margin-top:10px}
.tl-track{position:absolute;left:0;right:0;top:22px;height:2px;background:var(--line)}
.tl-band{position:absolute;top:17px;height:12px;border-radius:6px;transform-origin:left center;}
.tl-dot{position:absolute;top:15px;width:16px;height:16px;margin-left:-8px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 3px rgba(5,17,34,.3);}
.tl-deadline{position:absolute;top:2px;bottom:4px;width:0;border-left:2px dashed var(--red)}
.tl-deadline span{position:absolute;top:-2px;left:5px;font-size:11px;font-weight:700;color:var(--red);font-family:var(--font-num);white-space:nowrap}
.tl-ticks{position:absolute;left:0;right:0;bottom:-6px;height:12px;font-size:10px;color:var(--slate-400);font-family:var(--font-num)}
.tl-ticks span{position:absolute;transform:translateX(-50%)}
.tl-ticks span:first-child{transform:none}
.tl.dark .tl-track{background:rgba(255,255,255,.18)}
.tl.dark .tl-dot{border-color:#1B2433}
.tl.dark .tl-ticks{color:rgba(255,255,255,.5)}
.tl.dark .tl-deadline{border-color:#FF7A6E}
.tl.dark .tl-deadline span{color:#FF8B80}

/* ---------- 首頁 ---------- */
.home-head{padding:64px 20px 8px}
.home-head .greet{font-size:var(--fs-2xl);font-weight:700;margin:6px 0 0;letter-spacing:-.01em}
.loc{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-sm);color:var(--slate-600)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 16px 4px}
.tile{position:relative;text-align:left;border-radius:var(--r-lg);padding:16px;min-height:120px;display:flex;flex-direction:column;justify-content:space-between;transition:transform 140ms var(--ease-out),box-shadow 200ms ease}
.tile:active{transform:scale(.97)}
.tile svg{width:30px;height:30px}
.tile b{font-size:var(--fs-lg)}
.tile small{display:block;font-size:var(--fs-xs);margin-top:2px;opacity:.8}
.tile-ride{background:var(--navy-800);color:#fff}
.tile-plan{background:var(--red);color:#fff}
.tile .new{position:absolute;top:14px;right:14px;font-size:11px;font-weight:700;background:#fff;color:var(--red);border-radius:var(--r-pill);padding:2px 8px}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;padding:22px 20px 10px}
.sec-title h2{font-size:var(--fs-md);margin:0;font-weight:700}
.trip{display:flex;gap:12px;align-items:center;padding:14px 16px;background:#fff;border-radius:var(--r-md);box-shadow:var(--shadow-card);margin:0 16px 10px}
.trip .day{width:44px;flex:none;text-align:center}
.trip .day b{display:block;font-size:var(--fs-sm)}
.trip .day span{font-size:11px;color:var(--slate-400)}
.trip .body{flex:1;min-width:0}
.trip .t1{font-weight:700;font-size:var(--fs-md)}
.trip .t2{font-size:var(--fs-sm);color:var(--slate-600);margin-top:2px}
.weekline{margin:4px 16px 0;padding:12px 16px;border-radius:var(--r-md);background:#fff;box-shadow:0 0 0 1px var(--line) inset;font-size:var(--fs-sm);color:var(--slate-600)}
.weekline b{color:var(--navy-800)}
.tabbar{display:flex;justify-content:space-around;padding:8px 12px 10px;background:#fff;border-top:1px solid var(--line)}
.tabbar span{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--slate-400)}
.tabbar span.on{color:var(--red)}
.tabbar svg{width:22px;height:22px}

/* ---------- 訊息 ---------- */
.chat{flex:1;padding:8px 14px;display:flex;flex-direction:column;gap:8px;background:#fff}
.bubble{max-width:78%;padding:10px 14px;border-radius:20px;font-size:var(--fs-md);line-height:1.45}
.bubble.in{background:#EEF0F3;align-self:flex-start;border-bottom-left-radius:6px}
.bubble.out{background:#2F7CF6;color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.bubble.hl{box-shadow:0 0 0 2.5px var(--red)}
.time-sep{align-self:center;font-size:11px;color:var(--slate-400);margin:6px 0}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;background:#F4F5F7;border-radius:28px;padding:18px 16px 26px;box-shadow:0 -8px 40px rgba(5,17,34,.25);animation:sheetIn 340ms var(--ease-drawer) both;z-index:20}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:#C9CED6;margin:0 auto 14px}
.shareapps{display:flex;gap:18px;padding:6px 4px 14px;overflow:hidden}
.shareapp{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--slate-600);width:62px}
.appicon{width:60px;height:60px;border-radius:15px;display:grid;place-items:center;color:#fff;font-weight:700}
.appicon.yoxi{background:var(--red);font-family:var(--font-num);font-size:17px;letter-spacing:-.02em;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--red)}
.appicon.g1{background:#9AA5B5}.appicon.g2{background:#B7C0CD}.appicon.g3{background:#CDD4DE}
.shareaction{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:14px;padding:14px 16px;font-weight:700;font-size:var(--fs-md);width:100%;transition:transform 140ms var(--ease-out)}
.shareaction:active{transform:scale(.98)}

/* ---------- AI 讀出 ---------- */
.ai-note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);background:#EAF1F8;color:var(--blue);font-size:var(--fs-sm);line-height:1.5}
.ai-note svg{width:18px;height:18px;flex:none;margin-top:1px}
.field{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field .k{width:72px;flex:none;font-size:var(--fs-sm);color:var(--slate-400)}
.field .v{flex:1;font-weight:700;font-size:var(--fs-md)}
.field .v small{display:block;font-weight:400;font-size:var(--fs-xs);color:var(--slate-400);margin-top:2px}
.field .edit{font-size:var(--fs-sm);color:var(--blue);font-weight:500;padding:6px 8px;border-radius:8px}
@media (hover:hover) and (pointer:fine){.field .edit:hover{background:#EAF1F8}}
.seg{display:inline-flex;background:#EAEDF3;border-radius:var(--r-pill);padding:3px}
.seg button{height:30px;padding:0 14px;border-radius:var(--r-pill);font-size:var(--fs-sm);font-weight:700;color:var(--slate-600);transition:background-color 160ms ease,color 160ms ease}
.seg button[aria-pressed="true"]{background:#fff;color:var(--navy-800);box-shadow:0 1px 2px rgba(5,17,34,.12)}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,#E6EAF0 0%,#F3F5F8 50%,#E6EAF0 100%);background-size:200% 100%;animation:shimmer 1.1s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}

/* ---------- 方案頁 ---------- */
.goal{padding:4px 20px 14px}
.goal h2{margin:0;font-size:var(--fs-xl);font-weight:700;letter-spacing:-.01em}
.goal p{margin:6px 0 0;font-size:var(--fs-sm);color:var(--slate-600)}
.depart{display:flex;align-items:baseline;gap:8px;margin:12px 0 2px}
.depart .big{font-size:34px;font-weight:700;line-height:1}
.depart span{font-size:var(--fs-sm);color:var(--slate-600)}
.whatis{font-size:var(--fs-xs);color:var(--slate-400);line-height:1.6;margin-top:12px}

/* ---------- 鎖定畫面 ---------- */
.lock{position:absolute;inset:0;background:radial-gradient(120% 70% at 30% 0%,#26446E 0%,#0B1F38 55%,#051122 100%);color:#fff;display:flex;flex-direction:column;align-items:center}
.lock .date{margin-top:74px;font-size:var(--fs-md);font-weight:500;opacity:.85}
.lock .clock{font-family:var(--font-num);font-weight:600;font-size:86px;line-height:1;letter-spacing:-.03em;margin-top:2px}
.lock .wx{display:flex;align-items:center;gap:6px;font-size:var(--fs-sm);opacity:.85;margin-top:8px}
.lock .wx svg{width:16px;height:16px}
.la{position:absolute;left:12px;right:12px;bottom:110px;background:rgba(14,20,30,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:24px;padding:14px 16px 12px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.la-top{display:flex;align-items:center;gap:8px}
.la-icon{width:26px;height:26px;border-radius:7px;background:var(--red);display:grid;place-items:center;font-family:var(--font-num);font-weight:700;font-size:10px}
.la-title{font-size:var(--fs-sm);font-weight:700;flex:1}
.la-light{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs);font-weight:700;padding:4px 9px;border-radius:var(--r-pill);transition:background-color 240ms ease,color 240ms ease}
.la-light.go{background:rgba(14,159,75,.22);color:#5EE08F}
.la-light.warn{background:rgba(229,154,0,.22);color:#FFC94D}
.la-light.stop{background:rgba(216,58,46,.28);color:#FF8B80}
.la-row{display:flex;gap:18px;margin-top:10px}
.la-row div{font-size:11px;color:rgba(255,255,255,.6)}
.la-row b{display:block;font-family:var(--font-num);font-size:20px;color:#fff;font-weight:600;margin-top:1px}
.la-sub{font-size:var(--fs-xs);color:rgba(255,255,255,.72);margin-top:8px;display:flex;align-items:center;gap:6px}
.la-sub svg{width:14px;height:14px}
.lock-hint{position:absolute;bottom:14px;font-size:var(--fs-xs);opacity:.55}
.notif{position:relative;margin-top:26px;width:calc(100% - 20px);background:rgba(248,249,251,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:var(--navy-900);border-radius:22px;padding:12px 14px;display:flex;gap:10px;text-align:left;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:notifIn 320ms var(--ease-drawer) both;z-index:30;transition:transform 140ms var(--ease-out)}
.notif:active{transform:scale(.98)}
@keyframes notifIn{from{transform:translateY(-24px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.notif .appicon{width:38px;height:38px;border-radius:10px;font-size:11px;box-shadow:none}
.notif b{font-size:var(--fs-sm)}
.notif p{text-wrap:pretty;margin:2px 0 0;font-size:var(--fs-sm);line-height:1.4;color:var(--navy-600)}
.notif .when{float:right;font-size:11px;color:var(--slate-400);font-weight:400}

/* ---------- 救援方案卡 ---------- */
.alert{margin:0 16px 12px;padding:14px 16px;border-radius:var(--r-md);background:var(--stop-soft);color:#7E1F17}
.alert b{display:block;font-size:var(--fs-lg)}
.alert span{font-size:var(--fs-sm)}
.ai-say{margin:0 16px 14px;padding:14px 16px;border-radius:var(--r-md);background:#fff;box-shadow:0 0 0 1px var(--line) inset;font-size:var(--fs-sm);line-height:1.6}
.ai-say .who{display:flex;align-items:center;gap:6px;font-size:var(--fs-xs);font-weight:700;color:var(--blue);margin-bottom:4px}
.ai-say .who svg{width:14px;height:14px}
.opt{margin:0 16px 12px}
.opt-head{display:flex;align-items:center;gap:8px}
.opt-head h3{margin:0;font-size:var(--fs-lg);font-weight:700}
.rank{font-size:11px;font-weight:700;color:#fff;background:var(--navy-800);border-radius:var(--r-pill);padding:3px 8px}
.opt .pick{margin-top:12px;height:44px;font-size:var(--fs-sm)}
.opt.first{box-shadow:0 0 0 2px var(--navy-800),var(--shadow-card)}
.excluded{margin:2px 16px 10px;padding:12px 14px;border-radius:var(--r-md);border:1.5px dashed var(--line-strong);display:flex;align-items:center;gap:10px;font-size:var(--fs-sm);color:var(--slate-400)}
.excluded svg{width:18px;height:18px}

/* ---------- 叫車確認 ---------- */
.mapish{height:250px;margin:-8px 0 0;position:relative;background:#E3E9F0;overflow:hidden}
.mapish svg{position:absolute;inset:0;width:100%;height:100%}
.rows .r{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:var(--fs-md)}
.rows .r:last-child{border-bottom:0}
.rows .r span{color:var(--slate-600);font-size:var(--fs-sm)}
.switch{width:46px;height:28px;border-radius:14px;background:var(--line-strong);position:relative;transition:background-color 200ms ease;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform 220ms var(--ease-out)}
.switch[aria-checked="true"]{background:var(--go)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
.spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin 700ms linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.matched{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r-md);background:var(--go-soft);color:#0A5E2D;font-size:var(--fs-sm);margin-top:12px;animation:viewIn 260ms var(--ease-out) both}
.matched svg{width:20px;height:20px}

/* ---------- 抵達 ---------- */
.arrive{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 28px}
.arrive .ok{width:76px;height:76px;border-radius:50%;background:var(--go);display:grid;place-items:center;color:#fff;animation:pop 420ms var(--ease-out) both}
.arrive .ok svg{width:38px;height:38px}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.arrive h2{font-size:var(--fs-2xl);margin:18px 0 6px}
.arrive p{margin:0;color:var(--slate-600);font-size:var(--fs-md)}
.summary{width:100%;margin-top:22px;text-align:left}
.summary .r{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:var(--fs-sm)}
.summary .r:last-child{border-bottom:0}
.summary .r span{color:var(--slate-600)}
.privacy{display:flex;align-items:center;gap:8px;font-size:var(--fs-xs);color:var(--slate-400);margin-top:14px}
.privacy svg{width:14px;height:14px}

/* ---------- 控制台 ---------- */
.panel{width:340px;flex:none;background:#fff;border-radius:24px;box-shadow:0 20px 50px -24px rgba(5,17,34,.35);padding:20px 22px;max-height:852px;display:flex;flex-direction:column}
.panel h1{margin:0;font-size:20px;font-weight:700}
.panel .sub{margin:4px 0 0;font-size:var(--fs-sm);color:var(--slate-600)}
.disclaimer{margin-top:10px;font-size:var(--fs-xs);color:#8A5A00;background:var(--warn-soft);border-radius:10px;padding:8px 10px;line-height:1.5}
.steps{list-style:none;margin:12px 0 0;padding:0;overflow-y:auto;flex:1}
.steps li button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:3px 10px;border-radius:12px;transition:background-color 160ms ease}
@media (hover:hover) and (pointer:fine){.steps li button:hover{background:var(--bg)}}
.steps .n{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--font-num);font-size:11px;font-weight:700;background:#EAEDF3;color:var(--slate-600);margin-top:1px}
.steps .t{font-size:var(--fs-sm);font-weight:500;line-height:1.4}
.steps .t small{display:block;font-size:11px;color:var(--slate-400);font-weight:400}
.steps li.done .n{background:var(--navy-800);color:#fff}
.steps li.cur button{background:var(--red-soft)}
.steps li.cur .n{background:var(--red);color:#fff}
.steps li.cur .t{font-weight:700}
.now{margin-top:10px;padding:12px 14px;border-radius:14px;background:var(--bg);font-size:var(--fs-sm);line-height:1.55;color:var(--slate-600)}
.now b{color:var(--navy-800)}
.ctrl{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:12px}
.ctrl .btn{height:46px;font-size:var(--fs-sm)}
.ctrl2{display:flex;gap:8px;margin-top:8px}
.ctrl2 button{flex:1;height:38px;border-radius:var(--r-pill);font-size:var(--fs-xs);font-weight:700;color:var(--slate-600);box-shadow:0 0 0 1px var(--line) inset;transition:background-color 160ms ease}
@media (hover:hover) and (pointer:fine){.ctrl2 button:hover{background:var(--bg)}}
.ctrl2 .trig{flex:1.6;color:#A82A20;box-shadow:0 0 0 1.5px #F2B8B2 inset}
.ctrl2 button[aria-pressed="true"]{background:var(--navy-800);color:#fff;box-shadow:none}
.kbd{font-size:11px;color:var(--slate-400);margin-top:10px;text-align:center}
body.recording .panel{display:none}
.showpanel{position:fixed;right:16px;bottom:16px;display:none;height:38px;padding:0 14px;border-radius:var(--r-pill);background:#fff;box-shadow:var(--shadow-card);font-size:var(--fs-xs);font-weight:700}
body.recording .showpanel{display:block}

/* ---------- 手機寬度：不畫手機外框，控制台縮成底部列 ---------- */
.mbar{display:none}
@media (max-width:760px){
  body{background:var(--bg)}
  .stage{padding:0;display:block;min-height:100dvh}
  .device{width:100%;height:calc(100dvh - 64px);border-radius:0;padding:0;box-shadow:none;background:none}
  .screen{border-radius:0}
  .island,.statusbar{display:none}
  .appbar{padding-top:18px}.home-head{padding-top:20px}
  .lock .date{margin-top:40px}
  .panel{display:none}
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;height:64px;align-items:center;gap:8px;padding:0 12px calc(env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);z-index:100}
  .mbar .lbl{flex:1;min-width:0;font-size:var(--fs-xs);color:var(--slate-600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mbar .lbl b{color:var(--navy-800)}
  .mbar .btn{height:42px;width:auto;padding:0 16px;font-size:var(--fs-sm)}
  .tabbar{padding-bottom:8px}
  .footer{padding-bottom:12px}
}
@media (prefers-reduced-motion:reduce){
  .view.enter{animation:fadeOnly 150ms ease both}.view.leave{animation:fadeOut 120ms ease both}
  .sheet,.notif,.matched,.arrive .ok{animation:fadeOnly 150ms ease both}
  .skel{animation:none}
}

<script>
/* ====== 示意資料（與提案文件 §3.5 一致）====== */
const SCALE={from:18*60+40,to:19*60+15,deadline:19*60};
const m=t=>{const[a,b]=t.split(':');return +a*60+ +b};
const pct=t=>((m(t)-SCALE.from)/(SCALE.to-SCALE.from)*100).toFixed(2);
const toneColor={go:'var(--go)',warn:'var(--warn)',stop:'var(--stop)',ink:'var(--navy-800)'};
function timeline({exp,worst,tone='ink',dark=false}){
  const band=worst?`<div class="tl-band" style="left:${pct(exp)}%;width:${pct(worst)-pct(exp)}%;background:${toneColor[tone]};opacity:.28"></div>`:'';
  return `<div class="tl${dark?' dark':''}" data-exp="${exp}" role="img" aria-label="預估 ${exp} 抵達${worst?'，最壞情況 '+worst:''}，期限 19:00">
    <div class="tl-track"></div>${band}
    <div class="tl-deadline" style="left:${pct('19:00')}%"><span>期限 19:00</span></div>
    <div class="tl-dot" style="left:${pct(exp)}%;background:${toneColor[tone]}"></div>
    <div class="tl-ticks">${['18:40','18:50','19:10'].map(t=>`<span style="left:${pct(t)}%">${t}</span>`).join('')}</div>
  </div>`;
}
const ic=(id,cls='')=>`<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
const leg=(id,t,taxi)=>`<span class="leg${taxi?' leg-taxi':''}">${ic(id)}${t}</span>`;
const arrow=`<svg class="sep" width="14" height="14" aria-hidden="true"><use href="#i-next"/></svg>`;

/* ====== 步驟 ====== */

 {t:'朋友傳來訊息',s:'分享到 yoxi',time:'17:53',now:'朋友傳來週五聚餐的時間地點。長按訊息分享到 yoxi，<b>不用自己輸入</b>。',next:'分享到 yoxi',view:'chat'},

}

/* ====== 控制 ====== */
let cur=0, autoTimer=null;
const views=document.getElementById('views');
const lightStatusbar=new Set(['lockGo','lockStop','lockWarn']);
function render(i,opts={}){
  cur=Math.max(0,Math.min(STEPS.length-1,i));
  const st=STEPS[cur];
  const old=views.querySelector('.view:not(.leave)');
  if(old&&!opts.instant){old.classList.add('leave');setTimeout(()=>old.remove(),190)}
  const el=document.createElement('section');
  el.className='view '+(opts.instant?'instant':'enter');
  if(opts.instant&&old){old.remove()}
  el.setAttribute('aria-label',st.t);
  el.innerHTML=V[st.view]();
  views.appendChild(el);
  document.getElementById('sbtime').textContent=st.time;
  document.getElementById('statusbar').style.color=lightStatusbar.has(st.view)?'#fff':'var(--navy-900)';
  document.getElementById('mark').classList.toggle('on-dark',lightStatusbar.has(st.view));
  document.getElementById('screen').classList.toggle('dark',lightStatusbar.has(st.view));
  bind(el,st.view);
  animateTimelines(el,opts);
  renderPanel();
}
let lastLock=null;
function animateTimelines(el,opts){
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const lock=el.querySelector('.la .tl');
  const bands=[...el.querySelectorAll('.tl-band')];
  if(reduce||opts.instant){lastLock=lock?lock.dataset.exp:null;return}
  if(lock&&lastLock&&lastLock!==lock.dataset.exp){
    const dot=lock.querySelector('.tl-dot');const w=lock.getBoundingClientRect().width;
    const dx=(pct(lastLock)-pct(lock.dataset.exp))/100*w;
    dot.animate([{transform:`translateX(${dx}px)`},{transform:'translateX(0)'}],{duration:520,easing:'cubic-bezier(.23,1,.32,1)',delay:120,fill:'backwards'});
  }
  bands.forEach((b,k)=>b.animate([{transform:'scaleX(0)',opacity:0},{transform:'scaleX(1)',opacity:.28}],{duration:480,easing:'cubic-bezier(.23,1,.32,1)',delay:160+k*60,fill:'backwards'}));
  lastLock=lock?lock.dataset.exp:null;
}
function bind(el,view){
  el.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{if(!b.disabled)render(cur+1)}));
  el.querySelectorAll('[data-back]').forEach(b=>b.addEventListener('click',()=>render(cur-1)));
  el.querySelectorAll('[data-restart]').forEach(b=>b.addEventListener('click',()=>render(0)));
  el.querySelectorAll('[data-switch]').forEach(b=>b.addEventListener('click',()=>b.setAttribute('aria-checked',b.getAttribute('aria-checked')!=='true')));
  if(view==='parse'){
    const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(()=>{
      if(!el.isConnected)return;
      el.querySelector('#fields').innerHTML=parsedFields;
      el.querySelector('#aistate').textContent='已從訊息讀出以下條件，請確認。AI 只讀條件，不計算時間與費用。';
      el.querySelector('#confirmBtn').disabled=false;
      el.querySelectorAll('[data-seg]').forEach(s=>s.addEventListener('click',()=>{el.querySelectorAll('[data-seg]').forEach(x=>x.setAttribute('aria-pressed','false'));s.setAttribute('aria-pressed','true')}));
    },reduce?200:1100);
  }
  if(view==='ride'){
    const btn=el.querySelector('#callBtn');
    btn.addEventListener('click',()=>callRide(el));
  }
}
function callRide(el){
  const btn=el.querySelector('#callBtn');
  if(btn.dataset.state==='done'){render(cur+1);return}
  if(btn.dataset.state==='busy')return;
  btn.dataset.state='busy';btn.disabled=true;
  btn.innerHTML='<span class="spinner" aria-hidden="true"></span>媒合司機中…';
  setTimeout(()=>{
    if(!el.isConnected)return;
    el.querySelector('#rideState').innerHTML=`<div class="matched">${ic('i-check')}<span><b>司機已接單</b>，晚高峰上車等候中位數約 7 分鐘</span></div>`;
    btn.dataset.state='done';btn.disabled=false;btn.textContent='快轉到抵達';
  },1300);
}
function next(opts={}){
  const st=STEPS[cur];
  if(st.view==='ride'){
    const el=views.querySelector('.view:not(.leave)');const btn=el&&el.querySelector('#callBtn');
    if(btn&&btn.dataset.state!=='done'){callRide(el);return}
  }
  if(cur===STEPS.length-1){render(0,opts);return}
  render(cur+1,opts);
}
function prev(opts={}){render(cur-1,opts)}

const stepsEl=document.getElementById('steps');
function renderPanel(){
  stepsEl.innerHTML=STEPS.map((s,i)=>`<li class="${i<cur?'done':''}${i===cur?' cur':''}"><button data-step="${i}" ${i===cur?'aria-current="step"':''}><span class="n">${i+1}</span><span class="t">${s.t}<small><span class="num">${s.time}</span>・${s.s}</small></span></button></li>`).join('');
  stepsEl.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>render(+b.dataset.step)));
  stepsEl.querySelector('.cur')?.scrollIntoView({block:'nearest'});
  document.getElementById('now').innerHTML=STEPS[cur].now;
  const label=STEPS[cur].next;
  document.getElementById('next').textContent=label;
  document.getElementById('mnext').textContent=cur===STEPS.length-1?'重新開始':'下一步';
  document.getElementById('mlbl').innerHTML=`<b>${cur+1}/${STEPS.length}</b>　${STEPS[cur].t}`;
  document.getElementById('prev').disabled=cur===0;
  document.getElementById('mprev').disabled=cur===0;
}
document.getElementById('next').addEventListener('click',next);
document.getElementById('prev').addEventListener('click',prev);
document.getElementById('mnext').addEventListener('click',next);
document.getElementById('mprev').addEventListener('click',prev);
document.getElementById('restart').addEventListener('click',()=>{stopAuto();render(0)});
document.getElementById('trigger').addEventListener('click',()=>{stopAuto();render(5)});
const autoBtn=document.getElementById('auto');
function stopAuto(){clearInterval(autoTimer);autoTimer=null;autoBtn.setAttribute('aria-pressed','false');autoBtn.textContent='自動播放'}
autoBtn.addEventListener('click',()=>{
  if(autoTimer){stopAuto();return}
  autoBtn.setAttribute('aria-pressed','true');autoBtn.textContent='停止播放';
  autoTimer=setInterval(()=>{if(cur===STEPS.length-1){stopAuto();return}next()},4200);
});
const toggleRec=()=>document.body.classList.toggle('recording');
document.getElementById('rec').addEventListener('click',toggleRec);
document.getElementById('showpanel').addEventListener('click',toggleRec);
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea'))return;
  if(e.key==='ArrowRight'){next({instant:true})}
  else if(e.key==='ArrowLeft'){prev({instant:true})}
  else if(e.key==='h'||e.key==='H'){toggleRec()}
});
document.addEventListener('click',e=>{const n=e.target.closest('[data-noop]');if(n){n.animate([{transform:'scale(1)'},{transform:'scale(.97)'},{transform:'scale(1)'}],{duration:220,easing:'ease-out'})}});
function fit(){const s=Math.min(1,(innerHeight-40)/852);document.documentElement.style.setProperty('--z',innerWidth>760?s.toFixed(3):1)}
if(new URLSearchParams(location.search).has('rec'))document.body.classList.add('recording');
addEventListener('resize',fit);fit();
const h=parseInt(location.hash.slice(1),10);
render(h>=1&&h<=STEPS.length?h-1:0,{instant:true});
</script>
